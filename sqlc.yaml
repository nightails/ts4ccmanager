version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/db/sql/schema.sql"
    queries: "internal/db/sql/query.sql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_interface: false
        output_db_file_name: "db.sql.go"
        output_models_file_name: "models.sql.go"
        rename:
          mod: "ModRecord"